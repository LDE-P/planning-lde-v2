<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Planning LDE V2</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8fafc;
      --bg2: #ffffff;
      --bg3: #f1f5f9;
      --accent: #3b82f6;
      --text: #1e293b;
      --text-dim: #64748b;
      --done: #16a34a;
      --wip: #2563eb;
      --review: #7c3aed;
      --spec: #d97706;
      --todo: #475569;
      --blocked: #dc2626;
      --na: #9ca3af;
      --récurrent: #0891b2;
      --fail: #f97316;
      --border: #e2e8f0;
      --hover: #f1f5f9;
      --radius: 6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    /* ── Header ── */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    /* ── Stats bar ── */
    #stats-bar {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--text-dim);
    }

    #stats-bar span strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ── Filters ── */
    #filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }

    .filter-btn:hover { background: var(--hover); color: var(--text); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .btn {
      padding: 5px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }

    .btn:hover { opacity: 0.85; }
    .btn.primary { background: var(--accent); border-color: var(--accent); }
    .btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Main content ── */
    main {
      padding: 16px 20px;
      max-width: 1100px;
    }

    /* ── Project card ── */
    .project-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
    }

    .project-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .project-header:hover { background: var(--hover); }

    .project-toggle {
      font-size: 14px;
      color: var(--text-dim);
      transition: transform 0.2s;
      width: 16px;
    }

    .project-card.open .project-toggle { transform: rotate(90deg); }

    .project-name {
      font-weight: 600;
      font-size: 14px;
      flex: 1;
    }

    .project-stack {
      font-size: 11px;
      color: var(--text-dim);
    }


    .project-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .progress-bar {
      width: 60px;
      height: 4px;
      background: var(--bg3);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--done);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .project-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 13px;
      transition: all 0.15s;
    }

    .icon-btn:hover { background: var(--hover); color: var(--text); }
    /* Emoji (🗑 🗃) sont des glyphes couleur — color: n'a pas d'effet.
       Astuce : color transparent + text-shadow à offset 0 repeint le glyphe. */
    .icon-btn-danger,
    .icon-btn-danger:hover {
      color: transparent;
      text-shadow: 0 0 0 var(--blocked);
    }

    /* ── Subprojects list ── */
    .subprojects-list {
      display: none;
      border-top: 1px solid var(--border);
    }

    .project-card.open .subprojects-list { display: block; }

    .subproject-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 14px 8px 28px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .subproject-row:last-child { border-bottom: none; }
    .subproject-row:hover { background: var(--hover); }

    .sp-expand {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 10px;
      padding: 2px 4px;
      margin-top: 2px;
      border-radius: 3px;
      transition: all 0.15s;
    }

    .sp-expand:hover { color: var(--text); }

    .sp-main {
      flex: 1;
      min-width: 0;
    }

    .sp-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sp-name {
      font-weight: 500;
      cursor: pointer;
    }

    .sp-name:hover { color: var(--accent); }

    .sp-titre {
      font-size: 12px;
      color: var(--text-dim);
      font-style: italic;
      margin-top: 2px;
    }

    /* ── Status badge ── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .status-badge:hover { opacity: 0.8; }

    .status-done    { background: rgba(34,197,94,.15);  color: var(--done);    border-color: rgba(34,197,94,.3); }
    .status-wip     { background: rgba(59,130,246,.15); color: var(--wip);     border-color: rgba(59,130,246,.3); }
    .status-review  { background: rgba(168,85,247,.15); color: var(--review);  border-color: rgba(168,85,247,.3); }
    .status-spec    { background: rgba(245,158,11,.15); color: var(--spec);    border-color: rgba(245,158,11,.3); }
    .status-todo    { background: rgba(107,114,128,.15);color: var(--todo);    border-color: rgba(107,114,128,.3); }
    .status-blocked   { background: rgba(239,68,68,.15);  color: var(--blocked);   border-color: rgba(239,68,68,.3); }
    .status-na        { background: rgba(75,85,99,.15);   color: var(--na);        border-color: rgba(75,85,99,.3); }
    .status-récurrent { background: rgba(8,145,178,.15);  color: var(--récurrent); border-color: rgba(8,145,178,.3); }
    .status-fail      { background: rgba(249,115,22,.15); color: var(--fail);      border-color: rgba(249,115,22,.3); }

    /* ── Meta row ── */
    .sp-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sp-charges {
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .sp-charges .raf { color: var(--spec); }

    .sp-target {
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      border-bottom: 1px dashed transparent;
      transition: border-color 0.15s;
    }

    .sp-target:hover { border-color: var(--text-dim); }

    .sp-qualif {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--bg3);
      color: var(--text-dim);
    }

    /* ── Steps ── */
    .steps-panel {
      display: none;
      padding: 6px 0 6px 12px;
      margin-top: 4px;
    }

    .steps-panel.open { display: block; }

    .step-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
      font-size: 12px;
    }

    .step-status-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: opacity 0.15s;
    }

    .step-status-badge:hover { opacity: 0.8; }

    .step-name {
      flex: 1;
      color: var(--text-dim);
    }

    .step-name.done { text-decoration: line-through; color: #4b5563; }

    .step-charges {
      font-size: 11px;
      color: var(--text-dim);
    }

    /* ── Status dropdown ── */
    .status-menu {
      position: absolute;
      z-index: 100;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
      display: none;
      flex-direction: column;
      gap: 2px;
      box-shadow: 0 8px 24px rgba(0,0,0,.15);
      min-width: 130px;
    }

    .status-menu.open { display: flex; }

    .status-menu-item {
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.1s;
    }

    .status-menu-item:hover { background: var(--hover); }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 16px 48px rgba(0,0,0,.12);
    }

    .modal h2 { font-size: 16px; margin-bottom: 16px; }

    .form-group { margin-bottom: 12px; }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 7px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .form-group textarea { resize: vertical; min-height: 60px; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    /* ── Inline edit ── */
    .inline-edit {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-size: 12px;
      padding: 2px 6px;
      outline: none;
    }

    .inline-edit:focus { border-color: var(--accent); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 16px;
      border-radius: var(--radius);
      background: var(--bg2);
      border: 1px solid var(--border);
      font-size: 13px;
      z-index: 300;
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.25s;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { border-color: var(--done); color: var(--done); }
    #toast.error   { border-color: var(--blocked); color: var(--blocked); pointer-events: auto; }
    #toast .toast-close {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 13px;
      padding: 0;
      line-height: 1;
      opacity: 0.8;
    }
    #toast .toast-close:hover { opacity: 1; }

    /* ── Loading ── */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: var(--text-dim);
      font-size: 14px;
    }

    /* ── Empty state ── */
    .empty {
      padding: 40px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
    }

    /* ── Add project button ── */
    #add-project-btn {
      margin: 0 20px 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
    }

    /* ── View tabs (Projets / Docs) ── */
    #view-tabs {
      display: flex;
      gap: 4px;
    }

    .view-tab {
      padding: 5px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s;
    }

    .view-tab:hover { background: var(--hover); color: var(--text); }
    .view-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── Docs filters bar ── */
    #docs-filters {
      padding: 12px 20px 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      font-size: 12px;
    }

    #docs-filters .filter-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #docs-filters .filter-group-label {
      color: var(--text-dim);
      margin-right: 4px;
    }

    #docs-filters .toggle-empty {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-dim);
    }

    #docs-actions {
      padding: 0 20px 12px;
      display: flex;
      justify-content: flex-end;
    }

    /* ── Doc card ── */
    .doc-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin: 8px 14px;
      padding: 10px 14px;
      transition: background 0.15s;
    }

    .doc-card:hover { background: var(--hover); }

    .doc-card.archived { opacity: 0.7; }

    .doc-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .doc-type-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3px;
      border: 1px solid transparent;
    }

    .doc-type-spec   { background: rgba(59,130,246,.15);  color: var(--accent); border-color: rgba(59,130,246,.3); }
    .doc-type-audit  { background: rgba(245,158,11,.15);  color: var(--spec);   border-color: rgba(245,158,11,.3); }
    .doc-type-tests  { background: rgba(168,85,247,.15);  color: var(--review); border-color: rgba(168,85,247,.3); }
    .doc-type-bilan  { background: rgba(34,197,94,.15);   color: var(--done);   border-color: rgba(34,197,94,.3); }
    .doc-type-notes  { background: rgba(107,114,128,.15); color: var(--todo);   border-color: rgba(107,114,128,.3); }
    .doc-type-autre  { background: rgba(148,163,184,.15); color: var(--na);     border-color: rgba(148,163,184,.3); }

    .doc-status-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .doc-status-draft    { background: rgba(245,158,11,.15); color: var(--spec);  border-color: rgba(245,158,11,.3); }
    .doc-status-final    { background: rgba(34,197,94,.15);  color: var(--done);  border-color: rgba(34,197,94,.3); }
    .doc-status-archived { background: rgba(148,163,184,.15);color: var(--na);    border-color: rgba(148,163,184,.3); }

    .doc-title {
      font-weight: 600;
      flex: 1;
      min-width: 0;
    }

    .doc-date {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .doc-desc {
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .doc-sp-link {
      font-size: 11px;
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
      border-bottom: 1px dashed transparent;
    }

    .doc-sp-link:hover { border-color: var(--accent); }
    .doc-sp-link.orphan { color: var(--text-dim); cursor: default; pointer-events: none; }

    .doc-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .doc-actions a, .doc-actions button {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }

    .doc-actions a:hover, .doc-actions button:hover { background: var(--hover); color: var(--text); }

    .doc-empty {
      padding: 20px;
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
    }

    /* ── Docs inline dans SP panel ──────────────────────────────── */
    .sp-docs-section {
      margin-top: 6px;
      padding-top: 4px;
      border-top: 1px dashed var(--border);
    }

    .sp-docs-label {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 500;
      padding: 2px 0 3px 2px;
    }

    /* ── Bloc docs inline au niveau projet ──────────────────────── */
    .docs-inline-block {
      margin: 0;
      border-top: 1px solid var(--border);
      padding-left: 44px;
    }

    .docs-inline-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 8px 6px 0;
      font-size: 10px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .docs-inline-toggle:hover { color: var(--text); }

    .docs-inline-list { padding: 0 4px 4px 4px; }
    .docs-inline-list.collapsed { display: none; }

    /* ── Ligne doc commune aux deux niveaux ─────────────────────── */
    .doc-inline-row {
      padding: 3px 4px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .doc-inline-row:last-child { border-bottom: none; }

    .doc-inline-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .doc-inline-title {
      flex: 1;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .doc-inline-link {
      font-size: 11px;
      color: var(--accent);
      text-decoration: none;
      white-space: nowrap;
    }
    .doc-inline-link:hover { text-decoration: underline; }

    .doc-inline-finder {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 11px;
      padding: 0;
      color: var(--text-dim);
    }
    .doc-inline-finder:hover { color: var(--text); }

    .doc-inline-sp {
      font-size: 11px;
      margin-left: 4px;
      margin-top: 1px;
    }
    .doc-inline-sp .orphan { color: var(--blocked); }
    .doc-inline-sp .sp-archived { color: var(--text-dim); font-style: italic; }

    /* ── Panneau latéral docs ────────────────────────────────────── */
    #docs-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: 320px;
      height: 100vh;
      background: var(--bg2);
      border-left: 1px solid var(--border);
      box-shadow: -4px 0 16px rgba(0,0,0,.08);
      display: flex;
      flex-direction: column;
      z-index: 200;
      transform: translateX(100%);
      transition: transform 0.25s ease;
    }
    #docs-sidebar.open { transform: translateX(0); }

    #docs-sidebar-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      min-height: 48px;
      flex-shrink: 0;
    }
    #docs-sidebar-title {
      flex: 1;
      font-weight: 600;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text);
    }
    #docs-sidebar-close {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-dim);
      padding: 2px 4px;
      line-height: 1;
    }
    #docs-sidebar-close:hover { color: var(--text); }

    #docs-sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .sidebar-empty {
      padding: 24px 16px;
      color: var(--text-dim);
      font-size: 12px;
      text-align: center;
    }

    .sidebar-section {
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      margin-bottom: 4px;
    }
    .sidebar-section:last-child { border-bottom: none; margin-bottom: 0; }

    .sidebar-section-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-align: left;
    }
    .sidebar-section-toggle:hover { color: var(--text); background: var(--hover); }
    .sidebar-section-toggle .sidebar-arrow { font-size: 9px; flex-shrink: 0; }
    .sidebar-section-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sidebar-section-count { font-weight: 400; opacity: .7; flex-shrink: 0; }

    .sidebar-section-list { padding: 0 6px 4px 6px; }
    .sidebar-section-list.collapsed { display: none; }

    .sidebar-section-list .doc-inline-row { font-size: 11px; }

    /* ── Bouton toggle fixe ──────────────────────────────────────── */
    #docs-sidebar-tab {
      position: fixed;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      z-index: 201;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-right: none;
      border-radius: 6px 0 0 6px;
      padding: 10px 6px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-dim);
      box-shadow: -2px 0 8px rgba(0,0,0,.06);
      transition: right 0.25s ease, color 0.15s;
      writing-mode: vertical-rl;
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1;
    }
    #docs-sidebar-tab:hover { color: var(--text); }
    #docs-sidebar-tab.sidebar-open { right: 320px; }
    #docs-sidebar-tab .tab-label { font-size: 11px; font-weight: 500; }
  </style>
</head>
<body>

<header>
  <h1>Planning LDE — V2</h1>
  <div id="lock-banner" style="display:none;align-items:center;gap:8px;background:#d97706;color:#fff;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;margin:4px 0 2px;line-height:1.4"></div>
  <div id="view-tabs">
    <button class="view-tab active" data-view="projects">Projets</button>
    <button class="view-tab" data-view="docs">Docs <span id="docs-count-badge" style="opacity:.7"></span></button>
    <button class="view-tab" data-view="archives">Archives <span id="archives-count-badge" style="opacity:.7"></span></button>
  </div>
  <div id="stats-bar">
    <span>Sous-projets : <strong id="stat-total">—</strong></span>
    <span>En cours : <strong id="stat-wip" style="color:var(--wip)">—</strong></span>
    <span>À faire : <strong id="stat-todo">—</strong></span>
    <span>Done : <strong id="stat-done" style="color:var(--done)">—</strong></span>
    <span>Récurrents : <strong id="stat-récurrent" style="color:var(--récurrent)">—</strong></span>
  </div>
  <div id="filters">
    <button class="filter-btn" data-filter="wip">En cours</button>
    <button class="filter-btn" data-filter="récurrent">Récurrent</button>
    <button class="filter-btn" data-filter="todo">À faire</button>
    <button class="filter-btn" data-filter="spec">Spec</button>
    <button class="filter-btn" data-filter="review">Revue</button>
    <button class="filter-btn active" data-filter="all">Tous</button>
    <span style="color:var(--border);padding:0 2px">|</span>
    <button class="filter-btn" id="btn-open-all">Tout ouvrir</button>
    <button class="filter-btn" id="btn-close-all">Tout fermer</button>
  </div>
</header>

<div id="docs-filters" style="display:none">
  <div class="filter-group">
    <span class="filter-group-label">Type :</span>
    <button class="filter-btn active" data-doc-type="all">Tous</button>
    <button class="filter-btn" data-doc-type="spec">Spec</button>
    <button class="filter-btn" data-doc-type="audit">Audit</button>
    <button class="filter-btn" data-doc-type="tests">Tests</button>
    <button class="filter-btn" data-doc-type="bilan">Bilan</button>
    <button class="filter-btn" data-doc-type="notes">Notes</button>
    <button class="filter-btn" data-doc-type="autre">Autre</button>
  </div>
  <div class="filter-group">
    <span class="filter-group-label">Statut :</span>
    <button class="filter-btn active" data-doc-status="draft">Brouillon</button>
    <button class="filter-btn active" data-doc-status="final">Final</button>
    <button class="filter-btn" data-doc-status="archived">Archivé</button>
  </div>
  <label class="toggle-empty">
    <input type="checkbox" id="toggle-empty-projects">
    Afficher projets sans docs
  </label>
</div>

<div id="docs-actions" style="display:none">
  <button class="btn primary" id="btn-add-doc">+ Ajouter un doc</button>
</div>

<main>
  <div id="loading">Chargement…</div>
  <div id="projects-container" style="display:none"></div>
  <div id="docs-container" style="display:none"></div>
  <div id="archives-container" style="display:none"></div>
  <button class="btn" id="add-project-btn" style="display:none">+ Nouveau projet</button>
</main>

<!-- Panneau latéral docs -->
<aside id="docs-sidebar">
  <div id="docs-sidebar-header">
    <span id="docs-sidebar-title">—</span>
    <button id="docs-sidebar-close" title="Fermer">✕</button>
  </div>
  <div id="docs-sidebar-body">
    <div class="sidebar-empty">Ouvre un projet pour voir ses docs.</div>
  </div>
</aside>
<button id="docs-sidebar-tab" title="Docs du projet">
  <span>📄</span>
  <span class="tab-label">Docs</span>
</button>

<!-- Status dropdown (shared, repositioned on use) -->
<div id="status-menu" class="status-menu" role="menu"></div>

<!-- Modal: Add subproject -->
<div class="modal-overlay" id="modal-add-sp">
  <div class="modal">
    <h2>Nouveau sous-projet</h2>
    <input type="hidden" id="modal-sp-project-id">
    <div class="form-group">
      <label>Nom *</label>
      <input type="text" id="modal-sp-name" placeholder="ex : Migration GitLab" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Description courte</label>
      <input type="text" id="modal-sp-titre" placeholder="Une phrase décrivant l'objectif." autocomplete="off">
    </div>
    <div class="form-group">
      <label>Qualif</label>
      <select id="modal-sp-qualif">
        <option value="">— aucune —</option>
        <option value="P0">P0 — Urgence</option>
        <option value="P1">P1 — Cette semaine</option>
        <option value="P2">P2 — Prochaines semaines</option>
        <option value="P3">P3 — Backlog</option>
      </select>
    </div>
    <div class="form-group">
      <label>Statut initial</label>
      <select id="modal-sp-status">
        <option value="todo">À faire</option>
        <option value="spec">Spec</option>
        <option value="wip">En cours</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" id="modal-sp-cancel">Annuler</button>
      <button class="btn primary" id="modal-sp-save">Créer</button>
    </div>
  </div>
</div>

<!-- Modal: Add project -->
<div class="modal-overlay" id="modal-add-proj">
  <div class="modal">
    <h2>Nouveau projet</h2>
    <div class="form-group">
      <label>Nom *</label>
      <input type="text" id="modal-proj-name" placeholder="ex : Nouveau Projet" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Description</label>
      <input type="text" id="modal-proj-desc" placeholder="Description courte." autocomplete="off">
    </div>
    <div class="form-group">
      <label>Stack</label>
      <input type="text" id="modal-proj-stack" placeholder="ex : Python · Django" autocomplete="off">
    </div>
    <div class="modal-actions">
      <button class="btn" id="modal-proj-cancel">Annuler</button>
      <button class="btn primary" id="modal-proj-save">Créer</button>
    </div>
  </div>
</div>

<!-- Modal: Confirm suppression -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal">
    <h2 id="modal-confirm-title">Supprimer ?</h2>
    <p id="modal-confirm-msg" style="font-size:13px;color:var(--text-dim);margin-bottom:16px"></p>
    <div class="modal-actions">
      <button class="btn" id="modal-confirm-cancel">Annuler</button>
      <button class="btn" id="modal-confirm-ok" style="background:var(--blocked);border-color:var(--blocked);color:#fff">Supprimer</button>
    </div>
  </div>
</div>

<!-- Modal: Renommer alias projet -->

<!-- Modal: Add / Edit doc -->
<div class="modal-overlay" id="modal-doc">
  <div class="modal" style="max-width:540px">
    <h2 id="modal-doc-title">Nouveau document</h2>
    <input type="hidden" id="modal-doc-id-existing">
    <div class="form-group">
      <label>Projet *</label>
      <select id="modal-doc-project"></select>
    </div>
    <div class="form-group">
      <label>Chemin du fichier (depuis GIT/) *</label>
      <input type="text" id="modal-doc-file" placeholder="ex : planning-lde-v2/SPEC-DOCS-MD.md" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Titre *</label>
      <input type="text" id="modal-doc-title-input" placeholder="ex : Spécification Vue Docs" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="modal-doc-desc" placeholder="Une phrase décrivant le contenu."></textarea>
    </div>
    <div style="display:flex;gap:10px">
      <div class="form-group" style="flex:1">
        <label>Type *</label>
        <select id="modal-doc-type">
          <option value="spec">Spec</option>
          <option value="audit">Audit</option>
          <option value="tests">Tests</option>
          <option value="bilan">Bilan</option>
          <option value="notes">Notes</option>
          <option value="autre">Autre</option>
        </select>
      </div>
      <div class="form-group" style="flex:1">
        <label>Statut *</label>
        <select id="modal-doc-status">
          <option value="draft">Brouillon</option>
          <option value="final">Final</option>
          <option value="archived">Archivé</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <div class="form-group" style="flex:1">
        <label>Date (YYYY-MM-DD)</label>
        <input type="text" id="modal-doc-date" placeholder="2026-05-15" autocomplete="off">
      </div>
      <div class="form-group" style="flex:1">
        <label>Sous-projet associé</label>
        <select id="modal-doc-sp">
          <option value="">— aucun —</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="modal-doc-cancel">Annuler</button>
      <button class="btn primary" id="modal-doc-save">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
