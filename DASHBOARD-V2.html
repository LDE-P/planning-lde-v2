<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning LDE V2</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --bg2: #16213e;
      --bg3: #0f3460;
      --accent: #e94560;
      --text: #eaeaea;
      --text-dim: #9ca3af;
      --done: #22c55e;
      --wip: #3b82f6;
      --review: #a855f7;
      --spec: #f59e0b;
      --todo: #6b7280;
      --blocked: #ef4444;
      --na: #4b5563;
      --border: #2d3748;
      --hover: #1e2a3a;
      --radius: 6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
    }

    /* ── Header ── */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    /* ── Stats bar ── */
    #stats-bar {
      display: flex;
      gap: 16px;
      font-size: 13px;
      color: var(--text-dim);
    }

    #stats-bar span strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ── Filters ── */
    #filters {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }

    .filter-btn:hover { background: var(--hover); color: var(--text); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ── GSheet toolbar ── */
    #gsheet-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      padding: 5px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg3);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }

    .btn:hover { opacity: 0.85; }
    .btn.primary { background: var(--accent); border-color: var(--accent); }
    .btn:disabled { opacity: 0.4; cursor: default; }

    #gsheet-status {
      font-size: 12px;
      color: var(--text-dim);
    }

    #gsheet-status.connected { color: var(--done); }

    /* ── Main content ── */
    main {
      padding: 16px 20px;
      max-width: 1100px;
    }

    /* ── Project card ── */
    .project-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
    }

    .project-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .project-header:hover { background: var(--hover); }

    .project-toggle {
      font-size: 11px;
      color: var(--text-dim);
      transition: transform 0.2s;
      width: 14px;
    }

    .project-card.open .project-toggle { transform: rotate(90deg); }

    .project-name {
      font-weight: 600;
      font-size: 14px;
      flex: 1;
    }

    .project-stack {
      font-size: 11px;
      color: var(--text-dim);
    }

    .project-progress {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .progress-bar {
      width: 60px;
      height: 4px;
      background: var(--bg3);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--done);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .project-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 13px;
      transition: all 0.15s;
    }

    .icon-btn:hover { background: var(--hover); color: var(--text); }

    /* ── Subprojects list ── */
    .subprojects-list {
      display: none;
      border-top: 1px solid var(--border);
    }

    .project-card.open .subprojects-list { display: block; }

    .subproject-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 14px 8px 28px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    .subproject-row:last-child { border-bottom: none; }
    .subproject-row:hover { background: var(--hover); }

    .sp-expand {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 10px;
      padding: 2px 4px;
      margin-top: 2px;
      border-radius: 3px;
      transition: all 0.15s;
    }

    .sp-expand:hover { color: var(--text); }

    .sp-main {
      flex: 1;
      min-width: 0;
    }

    .sp-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sp-name {
      font-weight: 500;
      cursor: pointer;
    }

    .sp-name:hover { color: #93c5fd; }

    .sp-titre {
      font-size: 12px;
      color: var(--text-dim);
      font-style: italic;
      margin-top: 2px;
    }

    /* ── Status badge ── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .status-badge:hover { opacity: 0.8; }

    .status-done    { background: rgba(34,197,94,.15);  color: var(--done);    border-color: rgba(34,197,94,.3); }
    .status-wip     { background: rgba(59,130,246,.15); color: var(--wip);     border-color: rgba(59,130,246,.3); }
    .status-review  { background: rgba(168,85,247,.15); color: var(--review);  border-color: rgba(168,85,247,.3); }
    .status-spec    { background: rgba(245,158,11,.15); color: var(--spec);    border-color: rgba(245,158,11,.3); }
    .status-todo    { background: rgba(107,114,128,.15);color: var(--todo);    border-color: rgba(107,114,128,.3); }
    .status-blocked { background: rgba(239,68,68,.15);  color: var(--blocked); border-color: rgba(239,68,68,.3); }
    .status-na      { background: rgba(75,85,99,.15);   color: var(--na);      border-color: rgba(75,85,99,.3); }

    /* ── Meta row ── */
    .sp-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sp-charges {
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .sp-charges .raf { color: var(--spec); }

    .sp-target {
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      border-bottom: 1px dashed transparent;
      transition: border-color 0.15s;
    }

    .sp-target:hover { border-color: var(--text-dim); }

    .sp-qualif {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--bg3);
      color: var(--text-dim);
    }

    /* ── Steps ── */
    .steps-panel {
      display: none;
      padding: 6px 0 6px 12px;
      margin-top: 4px;
    }

    .steps-panel.open { display: block; }

    .step-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 3px 0;
      font-size: 12px;
    }

    .step-status-badge {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: opacity 0.15s;
    }

    .step-status-badge:hover { opacity: 0.8; }

    .step-name {
      flex: 1;
      color: var(--text-dim);
    }

    .step-name.done { text-decoration: line-through; color: #4b5563; }

    .step-charges {
      font-size: 11px;
      color: var(--text-dim);
    }

    /* ── Status dropdown ── */
    .status-menu {
      position: absolute;
      z-index: 100;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
      display: none;
      flex-direction: column;
      gap: 2px;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
      min-width: 130px;
    }

    .status-menu.open { display: flex; }

    .status-menu-item {
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.1s;
    }

    .status-menu-item:hover { background: var(--hover); }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 16px 48px rgba(0,0,0,.6);
    }

    .modal h2 { font-size: 16px; margin-bottom: 16px; }

    .form-group { margin-bottom: 12px; }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 7px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .form-group textarea { resize: vertical; min-height: 60px; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    /* ── Inline edit ── */
    .inline-edit {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-size: 12px;
      padding: 2px 6px;
      outline: none;
    }

    .inline-edit:focus { border-color: var(--accent); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 16px;
      border-radius: var(--radius);
      background: var(--bg2);
      border: 1px solid var(--border);
      font-size: 13px;
      z-index: 300;
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.25s;
      pointer-events: none;
    }

    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.success { border-color: var(--done); color: var(--done); }
    #toast.error   { border-color: var(--blocked); color: var(--blocked); }

    /* ── Loading ── */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: var(--text-dim);
      font-size: 14px;
    }

    /* ── Empty state ── */
    .empty {
      padding: 40px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
    }

    /* ── Add project button ── */
    #add-project-btn {
      margin: 0 20px 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
    }
  </style>
</head>
<body>

<header>
  <h1>Planning LDE — V2</h1>
  <div id="stats-bar">
    <span>Sous-projets : <strong id="stat-total">—</strong></span>
    <span>En cours : <strong id="stat-wip" style="color:var(--wip)">—</strong></span>
    <span>À faire : <strong id="stat-todo">—</strong></span>
    <span>Done : <strong id="stat-done" style="color:var(--done)">—</strong></span>
  </div>
  <div id="filters">
    <button class="filter-btn" data-filter="wip">En cours</button>
    <button class="filter-btn" data-filter="todo">À faire</button>
    <button class="filter-btn" data-filter="spec">Spec</button>
    <button class="filter-btn" data-filter="review">Revue</button>
    <button class="filter-btn active" data-filter="all">Tous</button>
  </div>
  <div id="gsheet-bar">
    <span id="gsheet-status">GSheet : —</span>
    <button class="btn" id="btn-pull-tcd">← Pull TCD</button>
    <button class="btn" id="btn-pull-gsheet">← Pull Tâches</button>
    <button class="btn primary" id="btn-push-gsheet">Push →</button>
  </div>
</header>

<main>
  <div id="loading">Chargement…</div>
  <div id="projects-container" style="display:none"></div>
  <button class="btn" id="add-project-btn" style="display:none">+ Nouveau projet</button>
</main>

<!-- Status dropdown (shared, repositioned on use) -->
<div id="status-menu" class="status-menu" role="menu"></div>

<!-- Modal: Add subproject -->
<div class="modal-overlay" id="modal-add-sp">
  <div class="modal">
    <h2>Nouveau sous-projet</h2>
    <input type="hidden" id="modal-sp-project-id">
    <div class="form-group">
      <label>Nom *</label>
      <input type="text" id="modal-sp-name" placeholder="ex : Migration GitLab" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Description courte</label>
      <input type="text" id="modal-sp-titre" placeholder="Une phrase décrivant l'objectif." autocomplete="off">
    </div>
    <div class="form-group">
      <label>Qualif</label>
      <select id="modal-sp-qualif">
        <option value="">— aucune —</option>
        <option value="P0">P0 — Urgence</option>
        <option value="P1">P1 — Cette semaine</option>
        <option value="P2">P2 — Prochaines semaines</option>
        <option value="P3">P3 — Backlog</option>
      </select>
    </div>
    <div class="form-group">
      <label>Statut initial</label>
      <select id="modal-sp-status">
        <option value="todo">À faire</option>
        <option value="spec">Spec</option>
        <option value="wip">En cours</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn" id="modal-sp-cancel">Annuler</button>
      <button class="btn primary" id="modal-sp-save">Créer</button>
    </div>
  </div>
</div>

<!-- Modal: Add project -->
<div class="modal-overlay" id="modal-add-proj">
  <div class="modal">
    <h2>Nouveau projet</h2>
    <div class="form-group">
      <label>Nom *</label>
      <input type="text" id="modal-proj-name" placeholder="ex : Nouveau Projet" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Alias (GSheet)</label>
      <input type="text" id="modal-proj-alias" placeholder="ex : NvProjet" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Description</label>
      <input type="text" id="modal-proj-desc" placeholder="Description courte." autocomplete="off">
    </div>
    <div class="form-group">
      <label>Stack</label>
      <input type="text" id="modal-proj-stack" placeholder="ex : Python · Django" autocomplete="off">
    </div>
    <div class="modal-actions">
      <button class="btn" id="modal-proj-cancel">Annuler</button>
      <button class="btn primary" id="modal-proj-save">Créer</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
